services:
  postgres:
    image: postgres:17-alpine
    container_name: meneses-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: meneses
      POSTGRES_USER: meneses
      POSTGRES_PASSWORD: meneses_dev_password

    ports:
      - "5432:5432"

    volumes:
      - meneses_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meneses -d meneses"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  meneses_postgres_data:
